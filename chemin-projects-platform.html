<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemin Projects | Engineering Operations Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============================================================
   CHEMIN PROJECTS — ENGINEERING OPERATIONS PLATFORM
   Design system derived from brand logo (navy / engineering blue / lime)
   ============================================================ */
:root{
  /* Brand core — sampled from logo */
  --navy-950:#061B45;
  --navy-900:#0A2A70;
  --navy-800:#123B8F;
  --navy-700:#1A4EA8;
  --blue-600:#1B6FB0;
  --blue-500:#2E86D1;
  --blue-400:#5CA6E0;
  --blue-100:#E8F2FB;
  --lime-600:#6FA82C;
  --lime-500:#8DC63F;
  --lime-400:#ACD766;
  --lime-100:#F0F8E2;

  /* Neutrals */
  --ink-900:#0F1626;
  --ink-700:#333A4D;
  --ink-500:#646B7C;
  --ink-400:#9499A8;
  --ink-300:#C1C5D1;
  --line:#E4E8F0;
  --line-soft:#EEF1F6;
  --paper:#F5F7FB;
  --white:#FFFFFF;

  /* Status */
  --amber-500:#F0A93B;
  --amber-100:#FCF0DC;
  --red-500:#E5555C;
  --red-100:#FCE7E8;
  --teal-500:#159895;
  --violet-500:#7C63E8;

  /* Discipline registry colors — engineering drawing-register convention */
  --disc-mech:#1B6FB0;
  --disc-process:#8DC63F;
  --disc-elec:#F0A93B;
  --disc-inst:#7C63E8;
  --disc-civil:#646B7C;
  --disc-piping:#159895;
  --disc-fire:#E5555C;
  --disc-proc:#C2437A;

  --radius-sm:8px;
  --radius:12px;
  --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(15,22,38,.06);
  --shadow:0 4px 16px rgba(15,22,38,.07), 0 1px 3px rgba(15,22,38,.06);
  --shadow-lg:0 20px 48px rgba(10,42,112,.14), 0 4px 12px rgba(15,22,38,.06);
  --sidebar-w:264px;
  --header-h:68px;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--ink-900);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.5;
}
h1,h2,h3,h4,.font-display{font-family:'Space Grotesk',sans-serif; letter-spacing:-.01em;}
.font-mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit;}
::selection{background:var(--lime-400); color:var(--navy-950);}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--ink-300); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
:focus-visible{outline:2px solid var(--blue-500); outline-offset:2px; border-radius:4px;}

/* ---------- Loading screen ---------- */
#loading-screen{
  position:fixed; inset:0; z-index:9999;
  background:radial-gradient(1200px 800px at 15% 10%, #0F3583 0%, var(--navy-950) 55%, #051230 100%);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  transition:opacity .6s ease, visibility .6s ease;
}
#loading-screen.hide{opacity:0; visibility:hidden; pointer-events:none;}
.load-logo{width:92px; height:auto; filter:drop-shadow(0 8px 24px rgba(0,0,0,.35)); animation:loadPulse 1.8s ease-in-out infinite;}
@keyframes loadPulse{0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.05); opacity:.85;}}
.load-bar{width:220px; height:3px; border-radius:3px; background:rgba(255,255,255,.15); margin-top:28px; overflow:hidden;}
.load-bar-fill{height:100%; width:40%; background:linear-gradient(90deg, var(--lime-500), var(--blue-400)); border-radius:3px; animation:loadSlide 1.1s ease-in-out infinite;}
@keyframes loadSlide{0%{transform:translateX(-120%);} 100%{transform:translateX(340%);}}
.load-text{color:rgba(255,255,255,.65); font-size:12px; letter-spacing:.14em; text-transform:uppercase; margin-top:16px; font-weight:600;}

/* ---------- Blueprint grid texture (signature motif) ---------- */
.blueprint-grid{
  background-image:
    linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
  background-size:28px 28px;
}
.blueprint-grid-dark{
  background-image:
    linear-gradient(rgba(10,42,112,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(10,42,112,.06) 1px, transparent 1px);
  background-size:24px 24px;
}

/* ============================================================ LOGIN */
.login-wrap{min-height:100vh; display:grid; grid-template-columns:1fr 1fr;}
@media (max-width:960px){.login-wrap{grid-template-columns:1fr;}}
.login-art{
  position:relative; overflow:hidden;
  background:radial-gradient(900px 700px at 20% 15%, #0F3583 0%, var(--navy-950) 55%, #04102A 100%);
  display:flex; flex-direction:column; justify-content:space-between; padding:56px;
}
@media (max-width:960px){.login-art{display:none;}}
.login-art::before{content:'';position:absolute; inset:0;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size:34px 34px; mask-image:radial-gradient(circle at 30% 30%, black, transparent 75%);}
.login-art-ring{position:absolute; border-radius:50%; border:1px solid rgba(141,198,63,.18);}
.login-badge{display:inline-flex; align-items:center; gap:8px; color:rgba(255,255,255,.7); font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; z-index:1;}
.login-quote{color:#fff; z-index:1; max-width:440px;}
.login-quote h2{font-size:30px; font-weight:600; line-height:1.28; margin:0 0 16px;}
.login-quote p{color:rgba(255,255,255,.6); font-size:14px; line-height:1.7; margin:0;}
.login-stats{display:flex; gap:32px; z-index:1;}
.login-stat b{display:block; font-family:'Space Grotesk',sans-serif; font-size:26px; color:#fff;}
.login-stat span{color:rgba(255,255,255,.55); font-size:12px;}
.login-form-side{display:flex; align-items:center; justify-content:center; padding:40px;}
.login-form{width:100%; max-width:380px;}
.login-form img.logo{height:52px; margin-bottom:28px;}
.login-form h1{font-size:24px; margin:0 0 6px; color:var(--navy-950);}
.login-form>p.sub{color:var(--ink-500); margin:0 0 32px; font-size:14px;}
.field{margin-bottom:18px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-700); margin-bottom:7px;}
.field input, select.input, textarea.input{
  width:100%; padding:11px 14px; border:1.5px solid var(--line); border-radius:10px;
  font-size:14px; font-family:inherit; background:var(--white); color:var(--ink-900);
  transition:border-color .15s, box-shadow .15s;
}
.field input:focus, select.input:focus, textarea.input:focus{border-color:var(--blue-500); box-shadow:0 0 0 4px var(--blue-100); outline:none;}
.field-row-between{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; font-size:13px;}
.checkbox-row{display:flex; align-items:center; gap:8px; color:var(--ink-700);}
.checkbox-row input{accent-color:var(--blue-600);}
.link-btn{color:var(--blue-600); font-weight:600; font-size:13px;}
.link-btn:hover{text-decoration:underline;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:10px; padding:11px 18px; font-weight:600; font-size:13.5px; cursor:pointer;
  border:1.5px solid transparent; transition:all .15s ease; white-space:nowrap;
}
.btn svg{width:16px; height:16px; flex:none;}
.btn-primary{background:linear-gradient(135deg, var(--blue-600), var(--navy-800)); color:#fff; box-shadow:0 4px 14px rgba(27,111,176,.32);}
.btn-primary:hover{transform:translateY(-1px); box-shadow:0 8px 20px rgba(27,111,176,.4);}
.btn-lime{background:linear-gradient(135deg, var(--lime-500), var(--lime-600)); color:#0F2A0A; box-shadow:0 4px 14px rgba(141,198,63,.32);}
.btn-outline{background:#fff; border-color:var(--line); color:var(--ink-700);}
.btn-outline:hover{border-color:var(--blue-500); color:var(--blue-600);}
.btn-ghost{background:transparent; color:var(--ink-500);}
.btn-ghost:hover{background:var(--line-soft); color:var(--ink-900);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:8px;}
.btn-danger{background:var(--red-100); color:var(--red-500);}
.divider-or{display:flex; align-items:center; gap:12px; color:var(--ink-400); font-size:12px; margin:22px 0;}
.divider-or::before,.divider-or::after{content:'';flex:1; height:1px; background:var(--line);}

/* ============================================================ APP SHELL */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:var(--sidebar-w); flex:none; position:fixed; top:0; left:0; bottom:0; z-index:40;
  background:linear-gradient(190deg, var(--navy-950) 0%, var(--navy-900) 60%, #0C2F7A 100%);
  display:flex; flex-direction:column; overflow:hidden;
}
.sidebar-brand{display:flex; align-items:center; gap:11px; padding:20px 20px 18px; border-bottom:1px solid rgba(255,255,255,.08); flex:none;}
.sidebar-brand img{height:34px; width:auto; flex:none;}
.sidebar-brand .brand-text{color:#fff;}
.sidebar-brand .brand-text b{display:block; font-family:'Space Grotesk',sans-serif; font-size:14.5px; letter-spacing:.01em;}
.sidebar-brand .brand-text span{display:block; font-size:10px; color:rgba(255,255,255,.5); letter-spacing:.1em; text-transform:uppercase; margin-top:1px;}
.sidebar-scroll{flex:1; overflow-y:auto; padding:14px 12px 20px;}
.sidebar-scroll::-webkit-scrollbar{width:5px;}
.sidebar-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);}
.nav-group{margin-bottom:4px;}
.nav-group-label{font-size:10.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:rgba(255,255,255,.32); padding:16px 12px 6px;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9.5px 12px; border-radius:9px; margin-bottom:2px;
  color:rgba(255,255,255,.72); font-size:13.3px; font-weight:500; cursor:pointer; transition:background .12s, color .12s;
  position:relative;
}
.nav-item svg{width:17px; height:17px; flex:none; opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:linear-gradient(90deg, rgba(141,198,63,.18), rgba(141,198,63,.04)); color:#fff; font-weight:600;}
.nav-item.active::before{content:'';position:absolute; left:-12px; top:8px; bottom:8px; width:3px; background:var(--lime-500); border-radius:0 3px 3px 0;}
.nav-item.active svg{opacity:1; color:var(--lime-400);}
.nav-item .chev{margin-left:auto; width:13px; height:13px; transition:transform .15s; opacity:.5;}
.nav-item.expanded .chev{transform:rotate(90deg);}
.nav-sub{padding-left:30px; max-height:0; overflow:hidden; transition:max-height .2s ease;}
.nav-sub.open{max-height:400px;}
.nav-sub .nav-item{font-size:12.7px; padding:8px 12px;}
.sidebar-footer{padding:14px 20px; border-top:1px solid rgba(255,255,255,.08); flex:none;}
.sidebar-user{display:flex; align-items:center; gap:10px;}
.sidebar-user .avatar{width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--lime-500),var(--blue-500)); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:13px; flex:none;}
.sidebar-user .u-name{color:#fff; font-size:13px; font-weight:600;}
.sidebar-user .u-role{color:rgba(255,255,255,.45); font-size:11px;}

.main-col{margin-left:var(--sidebar-w); flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  height:var(--header-h); flex:none; position:sticky; top:0; z-index:30;
  background:rgba(255,255,255,.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;
  padding:0 26px; gap:20px;
}
.topbar-left{display:flex; align-items:center; gap:16px; min-width:0;}
.breadcrumb{font-size:12px; color:var(--ink-400); display:flex; align-items:center; gap:6px;}
.page-title-mini{font-family:'Space Grotesk',sans-serif; font-size:16.5px; font-weight:600; color:var(--navy-950);}
.searchbox{display:flex; align-items:center; gap:9px; background:var(--paper); border:1.5px solid var(--line); border-radius:10px; padding:8px 14px; width:300px; color:var(--ink-400);}
.searchbox svg{width:15px; height:15px; flex:none;}
.searchbox input{border:none; background:transparent; outline:none; font-size:13px; width:100%; color:var(--ink-900);}
.topbar-right{display:flex; align-items:center; gap:8px; flex:none;}
.icon-btn{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--ink-500); cursor:pointer; position:relative; transition:background .12s;}
.icon-btn:hover{background:var(--line-soft); color:var(--navy-900);}
.icon-btn svg{width:18px; height:18px;}
.icon-btn .dot{position:absolute; top:7px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--red-500); border:2px solid #fff;}
.topbar-divider{width:1px; height:26px; background:var(--line); margin:0 4px;}
.toggle{width:38px; height:22px; border-radius:20px; background:var(--line); position:relative; cursor:pointer; flex:none; transition:background .15s;}
.toggle.on{background:var(--navy-800);}
.toggle::after{content:'';position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .15s;}
.toggle.on::after{transform:translateX(16px);}
.topbar-user{display:flex; align-items:center; gap:9px; cursor:pointer; padding:5px 10px 5px 5px; border-radius:11px; transition:background .12s;}
.topbar-user:hover{background:var(--line-soft);}
.topbar-user .avatar{width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,var(--navy-800),var(--blue-500)); color:#fff; font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center;}
.topbar-user .tu-name{font-size:12.5px; font-weight:600; color:var(--navy-950); line-height:1.2;}
.topbar-user .tu-role{font-size:10.5px; color:var(--ink-400);}

.content{padding:26px 30px 60px; flex:1;}
.screen{display:none;}
.screen.active{display:block; animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:24px; flex-wrap:wrap;}
.page-head h1{font-size:23px; margin:0 0 4px; color:var(--navy-950);}
.page-head .page-sub{color:var(--ink-500); font-size:13.5px; margin:0;}
.page-head-actions{display:flex; gap:10px; flex:none;}

/* ============================================================ GRID / CARD */
.grid{display:grid; gap:18px;}
.g-4{grid-template-columns:repeat(4,1fr);}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-2{grid-template-columns:repeat(2,1fr);}
.g-12{grid-template-columns:repeat(12,1fr);}
.span-8{grid-column:span 8;}
.span-7{grid-column:span 7;}
.span-6{grid-column:span 6;}
.span-5{grid-column:span 5;}
.span-4{grid-column:span 4;}
@media (max-width:1400px){.g-4{grid-template-columns:repeat(2,1fr);} .g-3{grid-template-columns:repeat(3,1fr);}}
@media (max-width:1100px){.g-12>*{grid-column:span 12 !important;} .g-3,.g-2{grid-template-columns:repeat(2,1fr);}}

.card{background:#fff; border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:22px;}
.card-flat{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
.card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.card-head h3{font-size:14.5px; margin:0; color:var(--navy-950); font-weight:600;}
.card-head .ch-sub{font-size:11.5px; color:var(--ink-400); margin-top:2px;}

.kpi-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden;}
.kpi-card .kpi-icon{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
.kpi-card .kpi-icon svg{width:19px; height:19px;}
.kpi-icon.bl{background:var(--blue-100); color:var(--blue-600);}
.kpi-icon.lm{background:var(--lime-100); color:var(--lime-600);}
.kpi-icon.am{background:var(--amber-100); color:var(--amber-500);}
.kpi-icon.rd{background:var(--red-100); color:var(--red-500);}
.kpi-icon.nv{background:var(--blue-100); color:var(--navy-800);}
.kpi-card .kpi-val{font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; color:var(--navy-950); line-height:1;}
.kpi-card .kpi-label{font-size:12px; color:var(--ink-500); margin-top:6px; font-weight:500;}
.kpi-trend{position:absolute; top:20px; right:20px; font-size:11px; font-weight:700; display:flex; align-items:center; gap:3px; padding:3px 7px; border-radius:6px;}
.kpi-trend.up{color:var(--lime-600); background:var(--lime-100);}
.kpi-trend.down{color:var(--red-500); background:var(--red-100);}
.kpi-trend svg{width:11px; height:11px;}

/* ============================================================ BADGES / CHIPS */
.badge{display:inline-flex; align-items:center; gap:5px; padding:3.5px 9px; border-radius:7px; font-size:11px; font-weight:700; letter-spacing:.01em;}
.badge-dot{width:6px; height:6px; border-radius:50%; flex:none;}
.badge.b-green{background:var(--lime-100); color:var(--lime-600);}
.badge.b-blue{background:var(--blue-100); color:var(--blue-600);}
.badge.b-amber{background:var(--amber-100); color:#9A6B0F;}
.badge.b-red{background:var(--red-100); color:var(--red-500);}
.badge.b-gray{background:var(--line-soft); color:var(--ink-500);}
.badge.b-navy{background:#E9EDF7; color:var(--navy-900);}
.disc-chip{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700; background:var(--line-soft); color:var(--ink-700);}
.disc-chip .dd{width:7px; height:7px; border-radius:50%; flex:none;}

.progress{height:7px; border-radius:6px; background:var(--line-soft); overflow:hidden; position:relative;}
.progress>span{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--blue-500),var(--navy-800));}
.progress.lime>span{background:linear-gradient(90deg,var(--lime-500),var(--lime-600));}
.progress.amber>span{background:linear-gradient(90deg,#f7c877,var(--amber-500));}
.progress.thin{height:5px;}

/* ============================================================ TABLE */
.table-wrap{overflow-x:auto; border-radius:var(--radius-lg);}
table.dtable{width:100%; border-collapse:collapse; font-size:13px; min-width:820px;}
table.dtable thead th{
  text-align:left; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-400);
  font-weight:700; padding:12px 16px; border-bottom:1.5px solid var(--line); background:var(--paper); white-space:nowrap;
}
table.dtable thead th:first-child{border-top-left-radius:var(--radius);}
table.dtable thead th:last-child{border-top-right-radius:var(--radius);}
table.dtable tbody td{padding:13px 16px; border-bottom:1px solid var(--line-soft); vertical-align:middle; color:var(--ink-700);}
table.dtable tbody tr{transition:background .12s;}
table.dtable tbody tr:hover{background:var(--blue-100);}
table.dtable tbody tr:last-child td{border-bottom:none;}
.cell-person{display:flex; align-items:center; gap:10px;}
.cell-person .av{width:32px; height:32px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; color:#fff;}
.cell-person .cp-name{font-weight:600; color:var(--navy-950); font-size:13px;}
.cell-person .cp-sub{font-size:11px; color:var(--ink-400);}
.table-toolbar{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:16px; flex-wrap:wrap;}
.filter-row{display:flex; gap:9px; flex-wrap:wrap; align-items:center;}
.select-mini{padding:8px 12px; border:1.5px solid var(--line); border-radius:9px; font-size:12.5px; background:#fff; color:var(--ink-700); font-family:inherit; cursor:pointer;}
.icon-action{width:30px; height:30px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; color:var(--ink-400); cursor:pointer; transition:all .12s;}
.icon-action:hover{background:var(--blue-100); color:var(--blue-600);}
.icon-action svg{width:15px; height:15px;}
.row-actions{display:flex; gap:4px;}
.table-pagination{display:flex; align-items:center; justify-content:space-between; margin-top:16px; font-size:12.5px; color:var(--ink-500);}
.pg-btns{display:flex; gap:6px;}
.pg-btn{width:30px; height:30px; border-radius:8px; border:1.5px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; font-weight:600; font-size:12px; color:var(--ink-600);}
.pg-btn.active{background:var(--navy-900); border-color:var(--navy-900); color:#fff;}

/* checkboxes */
.chk{width:16px; height:16px; border-radius:5px; accent-color:var(--blue-600);}

/* ============================================================ MISC COMPONENTS */
.section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-400); margin:0 0 12px;}
.tabs{display:flex; gap:4px; background:var(--paper); border:1px solid var(--line); border-radius:11px; padding:4px; width:fit-content;}
.tab-btn{padding:8px 16px; border-radius:8px; font-size:12.8px; font-weight:600; color:var(--ink-500); cursor:pointer; transition:all .15s;}
.tab-btn.active{background:#fff; color:var(--navy-900); box-shadow:var(--shadow-sm);}
.empty-state{text-align:center; padding:56px 20px; color:var(--ink-400);}
.empty-state svg{width:44px; height:44px; margin-bottom:14px; color:var(--ink-300);}
.empty-state h4{color:var(--ink-700); margin:0 0 6px; font-size:14px;}
.empty-state p{margin:0; font-size:12.5px;}
.avatar-stack{display:flex;}
.avatar-stack .as-item{width:26px; height:26px; border-radius:50%; border:2px solid #fff; margin-left:-8px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff;}
.avatar-stack .as-item:first-child{margin-left:0;}
.timeline-item{display:flex; gap:12px; padding-bottom:18px; position:relative;}
.timeline-item::before{content:'';position:absolute; left:5px; top:16px; bottom:0; width:1.5px; background:var(--line);}
.timeline-item:last-child::before{display:none;}
.timeline-dot{width:11px; height:11px; border-radius:50%; background:var(--blue-500); flex:none; margin-top:3px; box-shadow:0 0 0 3px var(--blue-100);}
.timeline-dot.g{background:var(--lime-500); box-shadow:0 0 0 3px var(--lime-100);}
.timeline-dot.a{background:var(--amber-500); box-shadow:0 0 0 3px var(--amber-100);}
.timeline-body b{display:block; font-size:12.8px; color:var(--navy-950); font-weight:600;}
.timeline-body span{font-size:11.5px; color:var(--ink-400);}
.tooltip-note{font-size:11.5px; color:var(--ink-400); margin-top:4px;}

/* modal / drawer */
.overlay{position:fixed; inset:0; background:rgba(6,15,35,.5); backdrop-filter:blur(2px); z-index:100; display:none; align-items:center; justify-content:center;}
.overlay.show{display:flex;}
.modal{background:#fff; border-radius:18px; width:460px; max-width:92vw; box-shadow:var(--shadow-lg); padding:26px; animation:modalIn .2s ease;}
@keyframes modalIn{from{opacity:0; transform:scale(.96) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);}}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-head h3{margin:0; font-size:16px;}
.toast-wrap{position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{background:var(--navy-950); color:#fff; padding:13px 18px; border-radius:11px; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px; font-size:13px; font-weight:500; animation:toastIn .25s ease; min-width:260px;}
.toast svg{width:17px; height:17px; color:var(--lime-400); flex:none;}
@keyframes toastIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

/* Kanban / allocation board */
.kanban-col{background:var(--paper); border-radius:var(--radius-lg); padding:14px; min-height:420px; border:1px solid var(--line);}
.kanban-col-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding:0 4px;}
.kanban-col-head h4{font-size:12.5px; margin:0; color:var(--navy-900); font-weight:700;}
.kanban-card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:13px; margin-bottom:10px; box-shadow:var(--shadow-sm); cursor:grab;}
.kanban-card:active{cursor:grabbing;}
.kanban-card .kc-name{font-size:12.8px; font-weight:600; color:var(--navy-950); margin-bottom:3px;}
.kanban-card .kc-role{font-size:11px; color:var(--ink-400); margin-bottom:9px;}
.kanban-card .kc-foot{display:flex; align-items:center; justify-content:space-between;}

/* calendar */
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
.cal-dow{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-400); text-align:center; font-weight:700; padding-bottom:4px;}
.cal-day{border:1px solid var(--line); border-radius:11px; min-height:88px; padding:8px; background:#fff; font-size:11.5px;}
.cal-day.muted{background:var(--paper); color:var(--ink-300);}
.cal-day .cd-num{font-weight:700; color:var(--ink-700); font-size:12px; margin-bottom:6px;}
.cal-day .cd-tag{font-size:9.5px; padding:2px 6px; border-radius:5px; margin-top:3px; display:inline-block; font-weight:700;}

/* org chart */
.org-tree{display:flex; flex-direction:column; align-items:center; gap:0; overflow-x:auto; padding:20px 0;}
.org-node{background:#fff; border:1.5px solid var(--line); border-radius:13px; padding:11px 16px; box-shadow:var(--shadow-sm); text-align:center; min-width:150px;}
.org-node .on-name{font-size:12.5px; font-weight:700; color:var(--navy-950);}
.org-node .on-role{font-size:10.5px; color:var(--ink-400); margin-top:2px;}
.org-level{display:flex; gap:28px; position:relative; padding-top:28px;}
.org-level::before{content:'';position:absolute; top:0; left:50%; width:1.5px; height:28px; background:var(--line);}
.org-row{display:flex; gap:24px; justify-content:center; flex-wrap:wrap;}

/* Screenshot gallery */
.shot-card{border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff; box-shadow:var(--shadow-sm); cursor:pointer; transition:transform .15s;}
.shot-card:hover{transform:translateY(-3px); box-shadow:var(--shadow);}
.shot-thumb{height:130px; background:linear-gradient(135deg,var(--blue-100),var(--lime-100)); display:flex; align-items:center; justify-content:center; position:relative;}
.shot-thumb svg{width:30px; height:30px; color:var(--blue-400);}
.shot-thumb .shot-live{position:absolute; top:8px; right:8px; background:var(--red-500); color:#fff; font-size:9px; font-weight:800; padding:2px 6px; border-radius:5px; letter-spacing:.05em;}
.shot-meta{padding:11px 13px;}
.shot-meta .sm-app{font-size:12px; font-weight:700; color:var(--navy-950);}
.shot-meta .sm-time{font-size:10.5px; color:var(--ink-400); margin-top:2px;}

.live-dot{width:8px; height:8px; border-radius:50%; background:var(--lime-500); display:inline-block; box-shadow:0 0 0 3px var(--lime-100); animation:pulseLive 1.6s infinite;}
@keyframes pulseLive{0%,100%{opacity:1;}50%{opacity:.4;}}
.idle-dot{width:8px; height:8px; border-radius:50%; background:var(--ink-300); display:inline-block;}

.skeleton{background:linear-gradient(90deg, var(--line-soft) 25%, #f0f2f7 37%, var(--line-soft) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:8px;}
@keyframes sk{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

.heat-cell{width:100%; aspect-ratio:1; border-radius:4px;}

@media (max-width:1180px){
  .sidebar{transform:translateX(-100%); transition:transform .25s ease;}
  .sidebar.open{transform:translateX(0);}
  .main-col{margin-left:0;}
  .searchbox{display:none;}
}
</style>
</head>

function buildSidebar(){
  const nav = document.getElementById('sidebar-nav');
  let html = '';
  NAV.forEach(entry=>{
    if(entry.type==='item'){
      html += navItemHTML(entry.id, entry.label, entry.icon, false);
    } else {
      const open = STATE.expandedGroups[entry.id];
      html += `<div class="nav-item ${open?'expanded':''}" onclick="toggleGroup('${entry.id}')">${ic(entry.icon)}<span>${entry.label}</span><span class="chev">${ic('chevright')}</span></div>`;
      html += `<div class="nav-sub ${open?'open':''}" id="sub-${entry.id}">`;
      entry.items.forEach(it=> html += navItemHTML(it.id, it.label, null, true));
      html += `</div>`;
    }
  });
  nav.innerHTML = html;
}
function navItemHTML(id,label,icon,sub){
  return `<div class="nav-item ${STATE.screen===id?'active':''}" onclick="go('${id}')" data-nav="${id}">${icon?ic(icon):''}<span>${label}</span></div>`;
}
function toggleGroup(id){ STATE.expandedGroups[id] = !STATE.expandedGroups[id]; buildSidebar(); }
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }
function toggleUserMenu(){ toast('Profile & settings menu'); }

function go(screenId){
  STATE.screen = screenId;
  const meta = PAGE_META[screenId] || PAGE_META.dashboard;
  document.getElementById('crumb-text').textContent = meta.crumb;
  document.getElementById('title-text').textContent = meta.title;
  buildSidebar();
  document.getElementById('content').innerHTML = renderScreen(screenId);
  document.getElementById('content').scrollTop = 0;
  window.scrollTo({top:0, behavior:'instant'});
  afterRenderHooks(screenId);
  document.getElementById('sidebar').classList.remove('open');
}

function toast(msg, icon){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `${ic(icon||'check2')}<span>${msg}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2600);
}

  <div class="grid g-12" style="margin-bottom:18px;">
    <div class="card span-6">
      <div class="card-head"><h3>Daily Trend</h3></div>
      <div style="height:200px;"><canvas id="chart-app-daily"></canvas></div>
    </div>
    <div class="card span-6">
      <div class="card-head"><h3>Usage Heatmap</h3><span class="ch-sub">Hour of day × day of week</span></div>
      <div id="heatmap-grid" style="display:grid; grid-template-columns:repeat(12,1fr); gap:4px; margin-top:8px;"></div>

  </div>

        <tr><td class="cp-name">${a.app}</td><td>${a.category}</td><td class="font-mono">${a.hours}h</td>
        <td style="width:200px;"><div style="display:flex; align-items:center; gap:8px;"><div class="progress thin"><span style="width:${a.pct*3}%"></span></div><span class="font-mono" style="font-size:11px;">${a.pct}%</span></div></td></tr>`).join('')}

function initAppUsageCharts(){
  const colors=['#1B6FB0','#8DC63F','#F0A93B','#7C63E8','#159895','#E5555C','#123B8F'];
  mkChart('chart-app-pie', {type:'pie', data:{labels:APPS_USAGE.map(a=>a.app), datasets:[{data:APPS_USAGE.map(a=>a.pct), backgroundColor:colors, borderWidth:3, borderColor:'#fff'}]}, options:{responsive:true,maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:8,usePointStyle:true,pointStyle:'circle',font:{size:10}}}}}});
  mkChart('chart-app-bar', {type:'bar', data:{labels:APPS_USAGE.map(a=>a.app), datasets:[{data:APPS_USAGE.map(a=>a.hours), backgroundColor:'#1B6FB0', borderRadius:6, maxBarThickness:30}]}, options:{responsive:true,maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{grid:{color:'#E4E8F0'}}, x:{grid:{display:false}, ticks:{maxRotation:0, font:{size:10}}}}}});
  mkChart('chart-app-daily', {type:'line', data:{labels:['Mon','Tue','Wed','Thu','Fri','Sat'], datasets:[{label:'Engineering apps', data:[6.2,6.8,6.4,7.1,6.9,2.1], borderColor:'#1B6FB0', backgroundColor:'rgba(27,111,176,.08)', fill:true, tension:.4, borderWidth:2.5}, {label:'Productivity apps', data:[2.1,2.4,2.0,2.6,2.2,0.8], borderColor:'#8DC63F', backgroundColor:'rgba(141,198,63,.08)', fill:true, tension:.4, borderWidth:2.5}]}, options:{responsive:true,maintainAspectRatio:false, plugins:{legend:{position:'top', labels:{boxWidth:8,usePointStyle:true,pointStyle:'circle', font:{size:10.5}}}}, scales:{y:{grid:{color:'#E4E8F0'}}, x:{grid:{display:false}}}}});
  const heat = document.getElementById('heatmap-grid');
  if(heat){ let html=''; for(let i=0;i<84;i++){ const v=Math.random(); const alpha=0.12+v*0.75; html+=`<div class="heat-cell" style="background:rgba(27,111,176,${alpha.toFixed(2)});"></div>`; } heat.innerHTML=html; }
}

/* ================= TIMESHEETS ================= */
function screenTimesheets(){
  return `
  <div class="page-head"><div><h1>Daily Timesheets</h1><p class="page-sub">Log engineering hours against active projects</p></div>
    <div class="page-head-actions">
      <div class="tabs">
        <div class="tab-btn ${STATE.calView==='table'?'active':''}" onclick="setCalView('table')">${ic('list')} Table</div>
        <div class="tab-btn ${STATE.calView==='calendar'?'active':''}" onclick="setCalView('calendar')">${ic('calendar')} Calendar</div>
      </div>
      <button class="btn btn-outline btn-sm">Save Draft</button>
      <button class="btn btn-primary btn-sm">Submit Timesheet</button>
    </div>
  </div>
  <div class="card" style="margin-bottom:18px;">
    <div class="card-head"><h3>New Entry</h3></div>
    <div class="grid g-12">
      <div class="span-2 field" style="margin:0;"><label>Date</label><input class="input" type="date" value="2026-08-20"></div>
      <div class="span-3 field" style="margin:0;"><label>Project</label><select class="input">${PROJECTS.map(p=>`<option>${p}</option>`).join('')}</select></div>
      <div class="span-3 field" style="margin:0;"><label>Activity</label><input class="input" placeholder="e.g. Isometric drawing review"></div>
      <div class="span-2 field" style="margin:0;"><label>Hours Worked</label><input class="input" type="number" value="8" step="0.5"></div>
      <div class="span-2 field" style="margin:0;"><label>&nbsp;</label><button class="btn btn-primary btn-block" onclick="toast('Entry added')">${ic('plus')} Add Entry</button></div>
    </div>
    <div class="field" style="margin-bottom:0;"><label>Remarks</label><textarea class="input" rows="2" placeholder="Optional notes…"></textarea></div>
  </div>
  <div id="timesheet-view">${STATE.calView==='table'?timesheetTable():timesheetCalendar()}</div>
  `;
}
function timesheetTable(){
  return `
  <div class="card">
    <div class="card-head"><h3>This Week's Entries</h3></div>
    <div class="table-wrap"><table class="dtable">
      <thead><tr><th>Employee</th><th>Date</th><th>Project</th><th>Activity</th><th>Hours</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${TIMESHEETS.map(t=>`
        <tr><td><div class="cell-person"><div class="av" style="background:${avaColor(t.emp)}">${initials(t.emp)}</div><div class="cp-name">${t.emp}</div></div></td>
        <td>${t.date}</td><td>${t.project}</td><td>${t.activity}</td><td class="font-mono">${t.hours}h</td>
        <td>${statusBadge(t.status)}</td>
        <td><div class="row-actions"><span class="icon-action">${ic('eye')}</span><span class="icon-action">${ic('edit')}</span></div></td></tr>`).join('')}
      </tbody>
    </table></div>
  </div>`;
}
function timesheetCalendar(){
  const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let cells='';
  for(let i=1;i<=31;i++){
    const hasEntry = i%3===0;
    cells += `<div class="cal-day ${i>19?'muted':''}"><div class="cd-num">${i}</div>${hasEntry?`<div class="cd-tag" style="background:var(--blue-100); color:var(--blue-600);">8.0h logged</div>`:''}${i%7===0?`<div class="cd-tag" style="background:var(--amber-100); color:#9A6B0F;">Pending</div>`:''}</div>`;
  }
  return `<div class="card"><div class="card-head"><h3>August 2026</h3><div class="row-actions"><span class="icon-action">${ic('chevright')}</span></div></div>
    <div class="cal-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div></div>`;
}
function setCalView(v){ STATE.calView=v; document.getElementById('content').innerHTML = screenTimesheets(); }

/* ================= APPROVALS ================= */

  </div>
  <div class="grid g-12">
    <div class="span-8">
      ${pending.map(t=>`
      <div class="card" style="margin-bottom:14px;">
        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:14px;">
          <div class="cell-person"><div class="av" style="background:${avaColor(t.emp)}">${initials(t.emp)}</div>
            <div><div class="cp-name" style="font-size:14px;">${t.emp}</div><div class="cp-sub">${t.project} · ${t.date}</div></div>
          </div>
          <div style="text-align:right;"><div class="font-mono" style="font-weight:700; color:var(--navy-950);">${t.hours}h</div><div class="cp-sub">Logged</div></div>

        <p style="font-size:12.8px; color:var(--ink-600); margin:12px 0 0; padding:10px 12px; background:var(--paper); border-radius:9px;">${t.activity}</p>
        <div style="display:flex; gap:8px; margin-top:14px;">
          <button class="btn btn-primary btn-sm" onclick="toast('Timesheet approved')">${ic('check2')} Approve</button>
          <button class="btn btn-danger btn-sm" onclick="toast('Timesheet rejected')">${ic('x')} Reject</button>
          <input class="input" placeholder="Add a comment…" style="flex:1; padding:8px 12px; font-size:12.5px;">
        </div>
      </div>`).join('')}
    </div>
    <div class="span-4">
      <div class="card">
        <div class="card-head"><h3>Approval Timeline</h3></div>

  </div>`;
}
